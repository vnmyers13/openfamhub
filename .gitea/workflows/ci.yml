name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef

jobs:
  backend:
    runs-on: openfamhub-python
    steps:
      - uses: builtin:checkout
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests with coverage
        # backend/.coveragerc sets the source and fail_under.
        run: cd backend && pytest -v --cov

  frontend:
    runs-on: openfamhub-node
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: builtin:checkout
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage
        # Thresholds live in vitest.config.ts.
        run: npm run test:coverage
      - name: Test build info
        run: npm run test:build-info
      - name: Build
        run: npm run build

  version:
    runs-on: openfamhub
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/master' || gitea.event_name == 'pull_request' && gitea.base_ref == 'master'
    steps:
      - uses: builtin:checkout
        with:
          fetch-depth: 0
      - name: Run the versioning harnesses
        run: |
          set -euo pipefail
          for t in scripts/tests/*-test.sh; do echo "== $t"; bash "$t"; done
      - name: Enforce the release-number rule
        run: |
          set -euo pipefail
          head=HEAD
          if [ "${{ gitea.ref }}" = "refs/heads/master" ]; then
            mode=master
            base='${{ gitea.event.before }}'
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="${head}^"
            fi
          else
            mode=branch
            base=$(git merge-base HEAD origin/master 2>/dev/null || git rev-parse HEAD^)
          fi
          scripts/check-version.sh "$mode" "$base" "$head"

  publish:
    needs: [backend, frontend, version]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/master'
    runs-on: openfamhub
    steps:
      - uses: builtin:checkout
      - name: Log in to the Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forgejo.vernonmyers.cloud --username vernon --password-stdin
      - name: Build and push images
        run: scripts/deploy.sh publish

  deploy:
    needs: [publish, version]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/master'
    runs-on: openfamhub
    steps:
      - uses: builtin:checkout
      - name: Install bundle and restart the stack
        run: scripts/deploy.sh server "$HOME/openfamhub"

  # ---------------------------------------------------------------------------
  # Trivy scan: non-blocking.  Scans published images and optionally creates
  # backlog issues from HIGH/CRITICAL findings.  Set CREATE_ISSUES=1 to enable
  # issue creation (requires secrets.TRIVY_ISSUE_TOKEN).
  # ---------------------------------------------------------------------------
  trivy:
    needs: [publish]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/master'
    runs-on: openfamhub
    env:
      GITEA_URL: https://forgejo.vernonmyers.cloud
      GITEA_REPO: vernon/OpenFamHub
      CREATE_ISSUES: "1"
    steps:
      - uses: builtin:checkout

      - name: Log in to the Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | \
             docker login forgejo.vernonmyers.cloud \
               --username vernon --password-stdin

      # --- API image scan (non-blocking) -----------------------------------
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: >-
            forgejo.vernonmyers.cloud/vernon/openfamhub-api:${{
              gitea.release_tag || 'latest' }}
          format:    json
          output:    trivy-api.json
          exit-code: '0'

      # --- Web image scan (non-blocking) ------------------------------------
      - name: Scan Web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: >-
            forgejo.vernonmyers.cloud/vernon/openfamhub-web:${{
              gitea.release_tag || 'latest' }}
          format:    json
          output:    trivy-web.json
          exit-code: '0'

      # --- Upload reports as CI artifacts -----------------------------------
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name:         trivy-reports
          path:         |
            trivy-api.json
            trivy-web.json
          retention-days: 30

      # --- (Optional) Create backlog issues from HIGH/CRITICAL findings -----
      - name: Create backlog issues from Trivy findings
        if: env.CREATE_ISSUES == '1' && secrets.TRIVY_ISSUE_TOKEN != ''
        run: |
          set -euo pipefail
          TOKEN="${secrets.TRIVY_ISSUE_TOKEN}"

          for report in trivy-api.json trivy-web.json; do
            [ ! -s "$report" ] && continue
            IMAGE=$(echo "$report" | sed 's/trivy-//;s/.json//')
            python3 scripts/create_trivy_issues.py \
              "$GITEA_URL" "$GITEA_REPO" "$TOKEN" "$IMAGE" "$report" || true
          done
