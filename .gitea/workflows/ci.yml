name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef

jobs:
  backend:
    runs-on: openfamhub-python
    steps:
      - uses: builtin:checkout
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests with coverage
        # backend/.coveragerc sets the source and fail_under.
        run: cd backend && pytest -v --cov

  frontend:
    runs-on: openfamhub-node
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: builtin:checkout
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage
        # Thresholds live in vitest.config.ts.
        run: npm run test:coverage
      - name: Test build info
        run: npm run test:build-info
      - name: Build
        run: npm run build

  version:
    runs-on: openfamhub
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/master' || gitea.event_name == 'pull_request' && gitea.base_ref == 'master'
    steps:
      - uses: builtin:checkout
        with:
          fetch-depth: 0
      - name: Run the versioning harnesses
        run: |
          set -euo pipefail
          for t in scripts/tests/*-test.sh; do echo "== $t"; bash "$t"; done
      - name: Enforce the release-number rule
        run: |
          set -euo pipefail
          head=HEAD
          if [ "${{ gitea.ref }}" = "refs/heads/master" ]; then
            mode=master
            base='${{ gitea.event.before }}'
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="${head}^"
            fi
          else
            mode=branch
            base=$(git merge-base HEAD origin/master 2>/dev/null || git rev-parse HEAD^)
          fi
          scripts/check-version.sh "$mode" "$base" "$head"

  publish:
    needs: [backend, frontend, version]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/master'
    runs-on: openfamhub
    steps:
      - uses: builtin:checkout
      - name: Log in to the Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forgejo.vernonmyers.cloud --username vernon --password-stdin
      - name: Build and push images
        run: scripts/deploy.sh publish

  deploy:
    needs: [publish, version]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/master'
    runs-on: openfamhub
    steps:
      - uses: builtin:checkout
      - name: Install bundle and restart the stack
        run: scripts/deploy.sh server "$HOME/openfamhub"

  # Trivy scan of the images `publish` just pushed (tag: scripts/release-name). Non-blocking:
  # findings and scan errors never turn CI red or hold up `deploy`. Reports are
  # uploaded as the `trivy-reports` artifact. With CREATE_ISSUES=1 and the
  # ISSUES_TOKEN secret set, HIGH/CRITICAL findings become backlog issues (one
  # per finding, never duplicated) and closed once a scan no longer finds them.
  # See docs/ci.md#trivy-scan.
  trivy:
    needs: [publish]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/master'
    runs-on: openfamhub
    env:
      FORGEJO_URL: https://forgejo.vernonmyers.cloud
      FORGEJO_REPO: vernon/OpenFamHub
      CREATE_ISSUES: "1"
    steps:
      - uses: builtin:checkout
      - name: Scan published images
        continue-on-error: true
        env:
          TRIVY_USERNAME: vernon
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}
        run: scripts/trivy-scan.sh
      - name: Upload scan reports
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-reports/
          retention-days: 30
      - name: Open and close issues for HIGH/CRITICAL findings
        if: env.CREATE_ISSUES == '1'
        continue-on-error: true
        env:
          TRIVY_ISSUE_TOKEN: ${{ secrets.ISSUES_TOKEN || secrets.TRIVY_ISSUE_TOKEN }}
        run: |
          if [ -z "$TRIVY_ISSUE_TOKEN" ]; then
            echo "ISSUES_TOKEN secret not set; skipping issue updates."
            exit 0
          fi
          for component in api web; do
            report="trivy-reports/trivy-$component.json"
            [ -s "$report" ] || { echo "No report for $component"; continue; }
            python3 scripts/create_trivy_issues.py "$FORGEJO_URL" "$FORGEJO_REPO" \
              "openfamhub-$component:$(scripts/release-name)" "$report"
          done

  # Keep Forgejo issues in step with TODO.md once a build is deployed to `test`:
  # close issues TODO.md marks done, then refresh the pinned "Triage report" issue
  # (open issues by priority, and drift from TODO.md). Non-blocking. See
  # docs/releasing.md.
  issues:
    needs: [deploy]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/master'
    runs-on: openfamhub
    steps:
      - uses: builtin:checkout
      - name: Close done issues and report triage
        continue-on-error: true
        env:
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN || secrets.TRIVY_ISSUE_TOKEN }}
        run: |
          if [ -z "$ISSUES_TOKEN" ]; then
            echo "ISSUES_TOKEN secret not set; skipping."
            exit 0
          fi
          python3 scripts/issues.py close-done --apply
          python3 scripts/issues.py triage --report-issue
